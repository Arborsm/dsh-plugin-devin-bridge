# dsh-plugin-devin-bridge bundle patch（dsh 0.2+）
#
# 把 Devin Connect 注册为 dsh LLM 的 `devin` provider route，
# 让 dsh 内部的 agent loop 能使用 Devin 托管的模型。
#
# entry id（下面的 `devin-bridge`）就是插件的 settings namespace：
# 所有 config 字段都是 volatile，插件详情页 Devin Bridge 卡片的写入即时生效。
#
# token 留空时自动从 Devin CLI 的 credentials.toml 读取（`devin auth login` 写入），
# 也可在设置页动态配置。
#   models: 可选，默认包含 glm-5-2 和 swe-1-7

- insert:
    - id: devin-bridge
      name: dsh-plugin-devin-bridge
      config:
        token: ""
        baseUrl: "https://server.codeium.com"
        proxy: ""
        forceHttp1: true
        defaultContextWindow: 128000
        defaultMaxTokens: 128000
        models:
          - id: "swe-2"
            name: "SWE-2"
            description: "Devin-hosted SWE-2 coding model"
            contextWindow: 262000
            maxTokens: 128000
            supportsImages: true
          - id: "swe-2-flash"
            name: "SWE-2 Flash"
            description: "Devin-hosted SWE-2 Flash fast coding model"
            contextWindow: 262144
            maxTokens: 128000
            supportsImages: false
        retryPolicy:
          mode: normal
          maxRetries: 3
          backoff:
            initialDelayMs: 500
            maxDelayMs: 10000
            jitterRatio: 0.1
        # 免费模型限流（[resource_exhausted]）：
        # 到点提醒默认开启；自动继续默认关闭，可在设置页或 remote.devin 手动开。
        rateLimitReminder: true
        rateLimitReminderLeadMinutes: 5
        rateLimitAutoResume: false
        rateLimitMaxResumeAttempts: 3
        rateLimitNotifyUrl: ""
